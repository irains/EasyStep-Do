name: Build Tauri (Win/macOS/Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows
            os: windows-latest
            bundles: msi,nsis
          - name: macos
            os: macos-latest
            bundles: app,dmg
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri:build -- --bundles ${{ matrix.platform.bundles }}

      - name: Print bundle outputs
        shell: bash
        run: |
          echo "=== bundle outputs ==="
          ls -R src-tauri/target/release/bundle || true

      - name: Build Windows portable package
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/target/release/bundle/portable | Out-Null
          Copy-Item src-tauri/target/release/app.exe src-tauri/target/release/行简.exe -Force
          Compress-Archive -Path src-tauri/target/release/行简.exe -DestinationPath src-tauri/target/release/bundle/portable/行简-portable-windows-x64.zip -Force

      - name: Upload Windows artifacts
        if: matrix.platform.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: xjtodo-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*setup*.exe
            src-tauri/target/release/bundle/portable/*.zip

      - name: Upload macOS artifacts
        if: matrix.platform.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: xjtodo-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg

      - name: Upload Linux artifacts
        if: matrix.platform.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: xjtodo-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: xjtodo-*
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "=== release-artifacts tree ==="
          ls -R release-artifacts || true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*setup*.exe
            release-artifacts/**/*portable*.zip
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.appimage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
